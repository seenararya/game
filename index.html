<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="seena.webp">
    <title>Game Anaya Seena Safira</title>
    <style>
        /* --- TEMA UNGU ESTETIK --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Quicksand', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #e0c3fc 0%, #cbb4d4 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #5d3b76;
            overflow-x: hidden; 
            overflow-y: auto; 
            position: relative;
        }

        /* --- ANIMASI GELEMBUNG BACKGROUND --- */
        .bg-bubbles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .bubble { position: absolute; bottom: -20px; background: rgba(255,255,255,0.3); border-radius: 50%; animation: terbang 10s infinite ease-in; }
        .bubble:nth-child(1) { width: 35px; height: 35px; left: 15%; animation-duration: 8s; }
        .bubble:nth-child(2) { width: 50px; height: 50px; left: 35%; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 25px; height: 25px; left: 70%; animation-duration: 7s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 70px; height: 70px; left: 55%; animation-duration: 15s; animation-delay: 0s; }
        .bubble:nth-child(5) { width: 40px; height: 40px; left: 85%; animation-duration: 9s; animation-delay: 3s; }
        @keyframes terbang { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-120vh) scale(1.5); opacity: 0; } }

        /* --- NAVBAR MELAYANG DI ATAS (STICKY TOP) --- */
        .top-navbar {
            display: none; 
            position: fixed;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            width: 96%; max-width: 1000px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 6px 12px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(93, 59, 118, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.9);
            align-items: center;
            gap: 8px;
        }
        .top-navbar.active { display: flex; }

        .btn-kembali {
            background: #ff7eb3; color: white;
            border: none; border-radius: 25px;
            padding: 6px 14px; font-size: 14px; font-weight: bold;
            cursor: pointer; box-shadow: 0 3px 0 #ff4757; transition: 0.2s;
            display: flex; align-items: center; gap: 4px;
            flex-shrink: 0;
        }
        .btn-kembali:active { transform: translateY(2px); box-shadow: 0 1px 0 #ff4757; }

        .nav-icons { 
            display: flex; gap: 6px; overflow-x: auto; 
            padding: 2px 0; scrollbar-width: none; flex-grow: 1; justify-content: flex-end;
        }
        .nav-icons::-webkit-scrollbar { display: none; }
        
        .nav-ikon-btn {
            background: rgba(255, 255, 255, 0.9); border: 2px solid #b185db;
            border-radius: 50%; width: 36px; height: 36px;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 2px 0 #b185db; flex-shrink: 0;
        }
        .nav-ikon-btn:active { transform: translateY(2px); box-shadow: 0 0px 0 #b185db; }

        /* --- CONTAINER KONTEN --- */
        .container {
            display: none; width: 100%; max-width: 1000px; margin: 0 auto;
            flex-direction: column; align-items: center;
            padding: 75px 15px 40px 15px;
            animation: fadeIn 0.4s ease-out;
        }
        .container.active { display: flex; }
        
        #welcome { padding-top: 15vh; justify-content: flex-start; min-height: 100vh; }
        #welcome h1 { font-size: 24px; padding: 12px 30px; border-radius: 40px; margin-bottom: 5px; }
        p.subtitle { font-size: 15px; color: #fff; margin-bottom: 25px; font-weight: bold; text-shadow: 1px 1px 2px rgba(93,59,118,0.3); text-align: center;}

        h1 { 
            font-size: 22px; color: #fff; text-shadow: 2px 2px 4px rgba(93,59,118,0.4); 
            margin-bottom: 12px; text-align: center;
            background: rgba(255,255,255,0.25); padding: 6px 20px; border-radius: 40px; backdrop-filter: blur(5px);
            border: 2px solid rgba(255,255,255,0.5);
            animation: floatSlow 3s ease-in-out infinite alternate;
        }

        /* --- DESAIN KARTU GELEMBUNG --- */
        .grid-menu, .grid-item { display: grid; gap: 10px; width: 100%; }
        .grid-menu { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); max-width: 700px; }
        .grid-item { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
        
        .card {
            background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(10px);
            border-radius: 22px;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(93, 59, 118, 0.1), inset 0 0 8px rgba(255,255,255,0.9);
            border: 2px solid rgba(255, 255, 255, 0.9); border-bottom: 4px solid #b185db;
            transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px 6px; text-align: center;
            animation: floatCard 3s ease-in-out infinite alternate;
        }
        .card:nth-child(even) { animation-delay: 0.5s; border-bottom-color: #f7a8b8; }
        .card:nth-child(3n) { animation-delay: 1s; border-bottom-color: #8ec5fc; }
        .card:nth-child(5n) { animation-delay: 1.5s; border-bottom-color: #fce38a; }
        .card:active { transform: scale(0.9) !important; box-shadow: 0 2px 4px rgba(93, 59, 118, 0.2); animation: none; }

        .icon { font-size: 32px; margin-bottom: 4px; display: inline-block; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2)); }
        .title { font-size: 12px; font-weight: bold; color: #5d3b76; line-height: 1.1; }
        .huruf-teks { font-size: 38px !important; font-weight: 900; color: #9c27b0; text-shadow: 2px 2px 0 #fff; margin:0;}
        .arab-teks { font-size: 36px !important; font-weight: 900; color: #00796b; margin: 0; }

        .btn-start { 
            background: linear-gradient(to right, #9d4edd, #c77dff); color: white; 
            padding: 12px 35px; font-size: 20px; font-weight: bold;
            border: 3px solid white; border-radius: 40px; cursor: pointer;
            box-shadow: 0 5px 0 #7b2cbf; animation: pulse 1.5s infinite; transition: 0.2s;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 2px 0 #7b2cbf; }

        .video-wrapper { 
            width: 100%; max-width: 750px; aspect-ratio: 16/9; 
            border-radius: 20px; overflow: hidden; border: 5px solid white; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); background: black; position: relative; margin-bottom: 12px;
        }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; position: absolute; top:0; left:0;}

        /* Animasi */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes floatSlow { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }
        @keyframes floatCard { 0% { transform: translateY(0px); } 100% { transform: translateY(-4px); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .anim-kepala { animation: geleng 1s; } @keyframes geleng { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-25deg);} 75%{transform:rotate(25deg);} }
        .anim-pundak { animation: naikturun 1s; } @keyframes naikturun { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-15px);} }
        .anim-lutut { animation: tekuk 1s; } @keyframes tekuk { 0%,100%{transform:scale(1,1);} 50%{transform:scale(1.1, 0.7) translateY(10px);} }
        .anim-kaki { animation: tendang 1s; } @keyframes tendang { 0%,100%{transform:rotate(0);} 50%{transform:rotate(30deg) translateX(15px);} }
        .anim-lompat { animation: lompat 0.8s; } @keyframes lompat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-20px) scale(1.2);} }
        .anim-goyang { animation: goyang 1s; } @keyframes goyang { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-15deg);} 75%{transform:rotate(15deg);} }
        .anim-besar { animation: besar 1s; } @keyframes besar { 0%,100%{transform:scale(1);} 50%{transform:scale(1.2);} }
    </style>
</head>

        // SUARA
        let suaraPilihan = null;
        function siapkanSuara() {
            let voices = window.speechSynthesis.getVoices();
            suaraPilihan = voices.find(v => v.lang === 'id-ID' && v.name.includes('Google')) || voices.find(v => v.lang === 'id-ID');
        }
        window.speechSynthesis.onvoiceschanged = siapkanSuara;

        function ucapkan(text) {
            window.speechSynthesis.cancel(); 
            let speech = new SpeechSynthesisUtterance(text);
            if(suaraPilihan) speech.voice = suaraPilihan;
            speech.lang = 'id-ID'; 
            speech.rate = 0.85;  
            speech.pitch = 1.15;  
            speech.volume = 1;
            window.speechSynthesis.speak(speech);
        }

        }

        function bukaHalaman(pageId, suaraTeks) {
            if(suaraTeks) ucapkan(suaraTeks);

            if (pageId === 'welcome') {
                document.getElementById('topNav').classList.remove('active');
            } else {
                document.getElementById('topNav').classList.add('active');
            }
            
            if (document.getElementById('video').classList.contains('active') && pageId !== 'video') {
                document.getElementById('yt-player').src = ''; 
            }
            if (pageId === 'video' && document.getElementById('yt-player').src === '') gantiVideo();

            document.querySelectorAll('.container').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function aksi(teks, elemenId, kelasAnimasi) {
            ucapkan(teks);

            if(ikon) {

                void ikon.offsetWidth; 
                ikon.classList.add(kelasAnimasi);
