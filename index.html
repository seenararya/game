<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/webp" href="seena.webp">
    <title>Game Anaya Seena Safira</title>
    <style>
        /* --- TEMA UNGU ESTETIK --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Quicksand', sans-serif; touch-action: manipulation; }
        
        body {
            background: linear-gradient(135deg, #e0c3fc 0%, #cbb4d4 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #5d3b76;
            overflow-x: hidden; 
            overflow-y: auto; 
            position: relative;
        }

        /* --- ANIMASI GELEMBUNG BACKGROUND --- */
        .bg-bubbles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .bubble { position: absolute; bottom: -20px; background: rgba(255,255,255,0.3); border-radius: 50%; animation: terbang 10s infinite ease-in; }
        .bubble:nth-child(1) { width: 40px; height: 40px; left: 10%; animation-duration: 8s; }
        .bubble:nth-child(2) { width: 60px; height: 60px; left: 30%; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 30px; height: 30px; left: 70%; animation-duration: 7s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 80px; height: 80px; left: 50%; animation-duration: 15s; animation-delay: 0s; }
        .bubble:nth-child(5) { width: 50px; height: 50px; left: 90%; animation-duration: 9s; animation-delay: 3s; }
        @keyframes terbang { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-120vh) scale(1.5); opacity: 0; } }

        /* --- NAVBAR MELAYANG DI ATAS --- */
        .top-navbar {
            display: none; 
            position: fixed;
            top: 15px; left: 50%;
            transform: translateX(-50%);
            width: 95%; max-width: 1000px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 8px 15px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(93, 59, 118, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.9);
            align-items: center;
            justify-content: space-between;
        }
        .top-navbar.active { display: flex; }

        .btn-kembali {
            background: #ff7eb3; color: white;
            border: none; border-radius: 30px;
            padding: 8px 15px; font-size: 16px; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 0 #ff4757; transition: 0.2s;
            display: flex; align-items: center; gap: 5px;
            flex-shrink: 0;
        }
        .btn-kembali:active { transform: translateY(3px); box-shadow: 0 1px 0 #ff4757; }

        .nav-icons { 
            display: flex; gap: 8px; overflow-x: auto; 
            padding: 4px 0; scrollbar-width: none; flex-grow: 1; justify-content: flex-end;
        }
        .nav-icons::-webkit-scrollbar { display: none; }
        
        .nav-ikon-btn {
            background: rgba(255, 255, 255, 0.9); border: 2px solid #b185db;
            border-radius: 50%; width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 3px 0 #b185db; flex-shrink: 0;
        }
        .nav-ikon-btn:active { transform: translateY(3px); box-shadow: 0 0px 0 #b185db; }

        /* --- CONTAINER KONTEN --- */
        .container {
            display: none; width: 100%; max-width: 1000px; margin: 0 auto;
            flex-direction: column; align-items: center;
            padding: 85px 15px 40px 15px;
            animation: fadeIn 0.4s ease-out;
        }
        .container.active { display: flex; }
        
        #welcome { padding-top: 15vh; justify-content: flex-start; min-height: 100vh; padding-top: 85px; }
        #welcome h1 { font-size: 35px; padding: 10px 30px; border-radius: 50px; margin-bottom: 10px; }
        p.subtitle { font-size: 18px; color: #fff; margin-bottom: 25px; font-weight: bold; text-shadow: 1px 1px 2px rgba(93,59,118,0.3); text-align: center;}

        /* --- DESAIN KARTU GELEMBUNG --- */
        .grid-menu, .grid-item { display: grid; gap: 15px; width: 100%; }
        .grid-menu { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); max-width: 850px; }
        .grid-item { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
        
        .card {
            background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(10px);
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(93, 59, 118, 0.15), inset 0 0 10px rgba(255,255,255,0.9);
            border: 3px solid rgba(255, 255, 255, 0.9); border-bottom: 6px solid #b185db;
            transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px 10px; text-align: center;
            animation: floatCard 3s ease-in-out infinite alternate;
        }
        .card:nth-child(even) { animation-delay: 0.5s; border-bottom-color: #f7a8b8; }
        .card:nth-child(3n) { animation-delay: 1s; border-bottom-color: #8ec5fc; }
        .card:nth-child(5n) { animation-delay: 1.5s; border-bottom-color: #fce38a; }
        .card:active { transform: scale(0.9) !important; box-shadow: 0 2px 5px rgba(93, 59, 118, 0.2); animation: none; }

        .icon { font-size: 45px; margin-bottom: 5px; display: inline-block; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2)); }
        .title { font-size: 15px; font-weight: bold; color: #5d3b76; line-height: 1.2; }
        .huruf-teks { font-size: 50px !important; font-weight: 900; color: #9c27b0; text-shadow: 2px 2px 0 #fff; margin:0;}
        .arab-teks { font-size: 45px !important; font-weight: 900; color: #00796b; margin: 0; }

        .btn-start { 
            background: linear-gradient(to right, #9d4edd, #c77dff); color: white; 
            padding: 15px 50px; font-size: 24px; font-weight: bold;
            border: 3px solid white; border-radius: 40px; cursor: pointer;
            box-shadow: 0 6px 0 #7b2cbf; animation: pulse 1.5s infinite; transition: 0.2s;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 2px 0 #7b2cbf; }

        .video-wrapper { 
            width: 100%; max-width: 750px; aspect-ratio: 16/9; 
            border-radius: 25px; overflow: hidden; border: 6px solid white; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); background: black; position: relative; margin-bottom: 15px;
        }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; position: absolute; top:0; left:0;}

        /* Animasi */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes floatSlow { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
        @keyframes floatCard { 0% { transform: translateY(0px); } 100% { transform: translateY(-5px); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .anim-kepala { animation: geleng 1s; } @keyframes geleng { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-25deg);} 75%{transform:rotate(25deg);} }
        .anim-pundak { animation: naikturun 1s; } @keyframes naikturun { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-15px);} }
        .anim-lutut { animation: tekuk 1s; } @keyframes tekuk { 0%,100%{transform:scale(1,1);} 50%{transform:scale(1.1, 0.7) translateY(10px);} }
        .anim-kaki { animation: tendang 1s; } @keyframes tendang { 0%,100%{transform:rotate(0);} 50%{transform:rotate(30deg) translateX(15px);} }
        .anim-lompat { animation: lompat 0.8s; } @keyframes lompat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-20px) scale(1.2);} }
        .anim-goyang { animation: goyang 1s; } @keyframes goyang { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-15deg);} 75%{transform:rotate(15deg);} }
        .anim-besar { animation: besar 1s; } @keyframes besar { 0%,100%{transform:scale(1);} 50%{transform:scale(1.2);} }
    </style>
</head>
<body>

    <div class="bg-bubbles">
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div>
    </div>

    <!-- NAVBAR ATAS -->
    <nav class="top-navbar" id="topNav">
        <button class="btn-kembali" onclick="bukaHalaman('home')">⬅️<span style="display:none;" id="teksKembali">Home</span></button>
        <div class="nav-icons" id="navIconsContainer"></div>
    </nav>

    <!-- HALAMAN AWAL -->
    <div id="welcome" class="container active">
        <div style="font-size: 55px; animation: floatSlow 2s infinite alternate;">👑</div>
        <h1 style="background: rgba(255,255,255,0.25); padding: 8px 25px; border-radius: 40px; font-size: 26px; color:#fff;">ANAYA SEENA SAFIRA</h1>
        <p class="subtitle">Bermain & Belajar Bersama</p>
        <button class="btn-start" onclick="mulaiGame()">Mulai Main 🎈</button>
    </div>

    <!-- MENU UTAMA -->
    <div id="home" class="container">
        <div class="grid-menu" id="menuGridContainer"></div>
    </div>

    <!-- SEMUA HALAMAN GAME -->

    <div id="hewan" class="container"><div class="grid-item" id="gridHewan"></div></div>
    <div id="huruf-murni" class="container"><div class="grid-item" id="grid-abjad"></div></div>
    <div id="huruf-benda" class="container"><div class="grid-item" id="grid-benda"></div></div>
    <div id="angka" class="container"><div class="grid-item" id="gridAngka"></div></div>
    <div id="hijaiyah" class="container"><div class="grid-item" id="gridHijaiyah"></div></div>
    <div id="mengaji" class="container"><div class="grid-item" id="gridMengaji"></div></div>
    <div id="surat" class="container"><div class="grid-item" id="gridSurat"></div></div>
    <div id="sholat" class="container"><div class="grid-item" id="gridSholat"></div></div>
    <div id="doa" class="container"><div class="grid-item" id="gridDoa"></div></div>
    <div id="bentuk" class="container"><div class="grid-item" id="gridBentuk"></div></div>
    <div id="profesi" class="container"><div class="grid-item" id="gridProfesi"></div></div>
    <div id="buah" class="container"><div class="grid-item" id="gridBuah"></div></div>
    <div id="transportasi" class="container"><div class="grid-item" id="gridTransportasi"></div></div>

    <!-- HALAMAN YOUTUBE -->
    <div id="video" class="container">
        <div class="video-wrapper">
            <iframe id="yt-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <button class="btn-start" style="font-size:18px; padding:12px 30px; margin-top:10px; background:#ff9a9e; border-color:#ff9a9e;" onclick="gantiVideo()">Acak Video Lainnya 🔄</button>
    </div>

    <script>

        const dataGerakan = [

        const dataHewan = [

            { t: 'Anjing', i: '🐶', s: 'Anjing. Guk guk guk!', a: 'anim-goyang' },

        let suaraPilihan = null;
        function siapkanSuara() {
            let voices = window.speechSynthesis.getVoices();
            suaraPilihan = voices.find(v => v.lang === 'id-ID' && v.name.includes('Google')) || voices.find(v => v.lang === 'id-ID');
        }
        window.speechSynthesis.onvoiceschanged = siapkanSuara;

        function ucapkan(text) {
            // Mencegah error antrean suara
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); 
            let speech = new SpeechSynthesisUtterance(text);
            if(suaraPilihan) speech.voice = suaraPilihan;
            speech.lang = 'id-ID'; 
            speech.rate = 0.85;  
            speech.pitch = 1.15;  
            speech.volume = 1;
            window.speechSynthesis.speak(speech);
        }

        function mulaiGame() {
            // Pindah halaman secara langsung tanpa menunggu antrean audio agar tidak pernah stuck
            document.getElementById('welcome').classList.remove('active');
            document.getElementById('home').classList.add('active');
            document.getElementById('topNav').classList.add('active');
            window.scrollTo(0, 0);

            // Suara dijalankan setelah halaman berpindah
            setTimeout(() => {
                ucapkan('Halo Anaya Seena Safira!');
            }, 100);
        }

        function bukaHalaman(pageId, suaraTeks) {
            if(suaraTeks) ucapkan(suaraTeks);

            if (pageId === 'welcome') {
                document.getElementById('topNav').classList.remove('active');
            } else {
                document.getElementById('topNav').classList.add('active');
            }
            
            if (document.getElementById('video').classList.contains('active') && pageId !== 'video') {
                document.getElementById('yt-player').src = ''; 
            }
            if (pageId === 'video' && document.getElementById('yt-player').src === '') gantiVideo();

            document.querySelectorAll('.container').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function aksi(teks, elemenId, kelasAnimasi) {
            ucapkan(teks);
            const ikon = document.getElementById(elemenId);
            if(ikon) {
                ikon.classList.remove(kelasAnimasi);
                void ikon.offsetWidth; 
                ikon.classList.add(kelasAnimasi);
                setTimeout(() => { ikon.classList.remove(kelasAnimasi); }, 1000);
            }
        }
